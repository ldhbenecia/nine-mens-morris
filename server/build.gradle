import org.springframework.boot.gradle.plugin.SpringBootPlugin

plugins {
    // 루트에는 적용하지 않음. bootJar 는 morris-api 에서만 만듦
    id 'org.springframework.boot' version '3.5.16' apply false
    id 'io.spring.dependency-management' version '1.1.7' apply false
    id 'com.diffplug.spotless' version '7.0.4'
}

allprojects {
    group = 'com.ninemensmorris'
    version = '0.0.1-SNAPSHOT'

    repositories {
        mavenCentral()
    }
}

subprojects {
    // api 설정을 쓰려면 java 가 아니라 java-library 여야 함
    apply plugin: 'java-library'
    apply plugin: 'io.spring.dependency-management'
    apply plugin: 'com.diffplug.spotless'

    java {
        toolchain {
            languageVersion = JavaLanguageVersion.of(21)
        }
    }

    configurations {
        compileOnly {
            extendsFrom annotationProcessor
        }
    }

    // Boot 3.5.16 이 고르는 Flyway(11.7.2)는 MySQL 8.1 까지만 검증됨. 8.4 지원은 11.13.3 부터
    // 기동 때 "Flyway upgrade recommended: MySQL 8.4 is newer…" WARN 이 났음
    // 11.x 안에서만 올림 — 메이저를 넘으면 Boot 의 Flyway 자동설정과 어긋날 수 있음
    // Boot 를 올려서 이 버전 이상이 기본값이 되면 이 줄은 지움
    ext['flyway.version'] = '11.13.3'

    dependencyManagement {
        imports {
            mavenBom SpringBootPlugin.BOM_COORDINATES
        }
    }

    dependencies {
        testImplementation 'org.junit.jupiter:junit-jupiter'
        testImplementation 'org.assertj:assertj-core'
        testRuntimeOnly 'org.junit.platform:junit-platform-launcher'
    }

    spotless {
        java {
            target 'src/**/*.java'
            // 빌더 체인이 많아 google-java-format 보다 줄바꿈이 자연스러움
            palantirJavaFormat()
            // 판 좌표표처럼 줄바꿈이 곧 의미인 곳은 spotless:off / spotless:on 으로 제외
            toggleOffOn()
            removeUnusedImports()
            trimTrailingWhitespace()
            endWithNewline()
        }
    }

    tasks.named('test') {
        useJUnitPlatform()
    }
}

// 루트는 자바 외 파일만 담당
spotless {
    format 'misc', {
        target '*.gradle', '*.md', '.gitignore', '**/src/**/*.yml', '.github/**/*.yml'
        trimTrailingWhitespace()
        endWithNewline()
    }
}
