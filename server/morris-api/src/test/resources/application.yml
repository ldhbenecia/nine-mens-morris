spring:
  # 운영과 같은 관측 설정으로 돌린다
  # 이 파일이 메인 application.yml 을 가리므로 import 하지 않으면
  # 프로브·메트릭 없이 테스트가 돌아 엔드포인트가 열렸는지 확인할 수 없다
  config:
    import: classpath:observability.yml

  # 메트릭 공통 태그가 이 값을 참조한다. 없으면 치환되지 않은 문자열이 태그로 붙는다
  application:
    name: nine-mens-morris

  # 운영과 같은 마이그레이션으로 스키마를 만든다
  # 테스트만 ddl-auto 로 만들면 운영 DDL 이 한 번도 검증되지 않는다
  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          time_zone: UTC
  security:
    oauth2:
      client:
        registration:
          kakao:
            client-name: kakao
            client-id: test-client-id
            client-secret: test-client-secret
            redirect-uri: "{baseUrl}/api/oauth2/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

cors:
  allowed-origins: http://localhost:5173

# 테스트 전용 더미 값. 실제 키가 아님
jwt:
  secret-key: dGVzdC1vbmx5LXNlY3JldC1rZXktMzJieXRlcy1sb25nISE=
  access-token-expiration: 3600000
  visitor-token-expiration: 604800000

app:
  frontend-url: http://localhost:5173
