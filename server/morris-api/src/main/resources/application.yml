spring:
  # 테스트 리소스의 application.yml 이 이 파일을 가리므로 관측 설정은 따로 둔다
  config:
    import: classpath:observability.yml

  application:
    name: nine-mens-morris

  # graceful shutdown 이 처리 중인 요청을 기다리는 한도. 짧으면 정산 트랜잭션이 잘린다
  lifecycle:
    timeout-per-shutdown-phase: 30s

  datasource:
    url: ${SPRING_DATASOURCE_URL}
    username: ${SPRING_DATASOURCE_USERNAME}
    password: ${SPRING_DATASOURCE_PASSWORD}
    driver-class-name: com.mysql.cj.jdbc.Driver

  # 스키마는 Flyway 가 만들고 Hibernate 는 엔티티와 맞는지 검사만 한다
  # 예전에는 ddl-auto 가 스키마를 만들어서 운영 DDL 이 어디에도 기록돼 있지 않았다
  flyway:
    enabled: true
    locations: classpath:db/migration

  jpa:
    hibernate:
      ddl-auto: validate
    # REST/STOMP 전용이라 뷰 렌더링 없음. 켜두면 응답 완료까지 커넥션 점유
    open-in-view: false
    properties:
      hibernate:
        jdbc:
          # 저장은 UTC 고정. 표시 시점 변환은 클라이언트가 함
          # 서버 지역을 옮기거나 서머타임이 있는 곳을 다루게 되면
          # 로컬 시각으로 저장된 값은 해석이 불가능해진다
          time_zone: UTC

  # 한 스레드를 공유하면 정산 하나가 DB 를 기다릴 때 다른 사람들의 유예가 전부 밀린다
  # SchedulingConfig 가 taskScheduler 빈을 만들어야 이 설정이 적용된다
  task:
    scheduling:
      pool:
        size: 4
      shutdown:
        # 돌고 있던 정산을 끊지 않는다
        await-termination: true
        await-termination-period: 20s

  security:
    oauth2:
      client:
        registration:
          kakao:
            # CustomOAuth2UserService 가 getClientName().equals("kakao") 로 분기
            # 이 값을 바꾸면 로그인이 실패
            client-name: kakao
            client-id: ${KAKAO_CLIENT_ID}
            client-secret: ${KAKAO_CLIENT_SECRET}
            # SecurityConfig 의 redirectionEndpoint baseUri 와 일치해야 함
            redirect-uri: "{baseUrl}/api/oauth2/kakao"
            authorization-grant-type: authorization_code
            client-authentication-method: client_secret_post
            scope:
              - profile_nickname
              - profile_image
              - account_email
        provider:
          kakao:
            authorization-uri: https://kauth.kakao.com/oauth/authorize
            token-uri: https://kauth.kakao.com/oauth/token
            user-info-uri: https://kapi.kakao.com/v2/user/me
            user-name-attribute: id

server:
  port: ${SERVER_PORT:8080}
  # X-Forwarded-* 를 반영해 getRemoteAddr 이 프록시가 아니라 실제 호출자를 돌려주게 한다
  # 이게 없으면 IP 당 발급 한도가 nginx IP 하나로 집계돼 모든 사용자가 한 카운터를 공유한다
  #
  # 헤더는 위조할 수 있으므로 앱이 프록시를 거치지 않고 직접 닿으면 한도를 우회당한다
  # 보안그룹으로 프록시만 앱에 닿게 막혀 있다는 전제 위에서만 맞는 설정
  forward-headers-strategy: framework
  # 배포할 때 진행 중인 요청을 끊지 않고 마무리한다
  # 게임 상태가 메모리에만 있어 어차피 재배포되면 사라지지만,
  # 적어도 정산 트랜잭션이 중간에 잘리지는 않게 함
  shutdown: graceful

# 프론트엔드 오리진. GitHub Pages 주소는 배포마다 다르므로 하드코딩하지 않음
cors:
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

# HS256 서명 키. Base64 인코딩된 32바이트(256비트) 이상
JWT_SECRET_KEY: ${JWT_SECRET_KEY}

# 밀리초 단위. JwtProvider 가 now.getTime() + 이 값으로 만료 시각 계산
ACCESS_TOKEN_EXPIRATION: ${ACCESS_TOKEN_EXPIRATION:3600000}

# 비로그인 사용자 토큰. 7일
# 토큰을 잃으면 그 신원으로 돌아올 방법이 없어 짧게 잡으면 게임 도중 끊긴다
# 탈취돼도 전적도 레이팅도 없어 잃을 것이 없다
VISITOR_TOKEN_EXPIRATION: ${VISITOR_TOKEN_EXPIRATION:604800000}

# 로그인 성공 후 리다이렉트할 프론트엔드 주소
DOMAIN: ${DOMAIN:http://localhost:5173}
