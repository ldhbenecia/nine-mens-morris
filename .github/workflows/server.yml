name: server

on:
  push:
    branches: [main]
    paths: ['server/**', '.github/workflows/server.yml']
  pull_request:
    paths: ['server/**', '.github/workflows/server.yml']

# 같은 브랜치에 새 커밋이 오면 진행 중인 옛 실행을 취소함
# 안 그러면 늦게 끝난 옛 빌드가 매니페스트 태그를 옛 커밋으로 덮어씀
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: server

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      - uses: gradle/actions/setup-gradle@v4

      # -x test 를 붙이지 않음. 테스트를 건너뛰는 빌드는 CI 로서 의미가 없음
      # Testcontainers 통합 테스트도 같이 돈다
      - run: ./gradlew build --no-daemon

  # 테스트가 통과한 main 커밋만 이미지로 만듦. PR 에서는 build 까지만 돌고 여기는 건너뜀
  image:
    needs: build
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    # 노드가 arm64(OrbStack, Graviton). amd64 러너에서 QEMU 로 빌드하면 Gradle 이 몇 배 느려짐
    runs-on: ubuntu-24.04-arm
    permissions:
      contents: read
      packages: write
    # 매니페스트 잡이 같은 문자열을 따로 계산하면 언젠가 어긋남. 여기서 한 번만 만듦
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v4

      - id: tag
        run: echo "tag=sha-${GITHUB_SHA::7}" >> "$GITHUB_OUTPUT"

      - uses: docker/setup-buildx-action@v3

      # GITHUB_TOKEN 은 워크플로마다 자동 발급되는 단기 토큰. 저장해 둔 비밀이 없음
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      # 매니페스트는 sha- 태그만 가리킴. latest 는 사람이 pull 할 때 쓰는 편의 태그
      # latest 를 매니페스트에 쓰면 문자열이 안 바뀌어 ArgoCD 가 새 이미지를 감지하지 못함
      - id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/nine-mens-morris
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=ref,event=branch
            type=raw,value=latest,enable={{is_default_branch}}

      # uses 단계에는 defaults.run.working-directory 가 적용되지 않아 context 를 직접 줘야 함
      - uses: docker/build-push-action@v6
        with:
          context: server
          platforms: linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ArgoCD 는 레지스트리를 보지 않고 매니페스트 레포만 봄
  # 새 이미지가 있다는 사실은 태그 문자열이 바뀐 커밋으로만 전달됨
  manifests:
    needs: image
    runs-on: ubuntu-latest
    steps:
      # GITHUB_TOKEN 은 이 레포 밖에 쓸 수 없음. 매니페스트 레포 하나로 범위를 좁힌 토큰을 씀
      - uses: actions/checkout@v4
        with:
          repository: ldhbenecia/ldh-infra-lab-manifests
          token: ${{ secrets.MANIFESTS_TOKEN }}
          path: manifests

      - working-directory: manifests
        env:
          TAG: ${{ needs.image.outputs.tag }}
          VALUES: apps/morris/game-server/values.yaml
        run: |
          yq -i ".image.tag = \"$TAG\"" "$VALUES"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add "$VALUES"
          if git diff --staged --quiet; then echo "변경 없음"; exit 0; fi
          git commit -m "ci(morris): game-server image → $TAG"
          # 다른 레포의 CI 가 먼저 push 했으면 그 위에 다시 얹음
          git pull --rebase
          git push
