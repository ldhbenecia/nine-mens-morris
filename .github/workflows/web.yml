name: web

on:
  push:
    branches: [main]
    paths: ['web/**', '.github/workflows/web.yml']
  pull_request:
    paths: ['web/**', '.github/workflows/web.yml']
  workflow_dispatch:
    inputs:
      deploy:
        description: 'Pages 로 배포까지 한다 (서버 주소가 준비된 뒤에)'
        type: boolean
        default: false

defaults:
  run:
    working-directory: web

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # 버전은 package.json 의 packageManager 에서 읽음
      # uses 단계에는 working-directory 가 적용되지 않아 경로를 직접 줘야 함
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: web/package.json

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: pnpm
          cache-dependency-path: web/pnpm-lock.yaml

      # lockfile 과 package.json 이 어긋나면 실패시킴. CI 에서 조용히 다른 버전을 깔지 않게
      - run: pnpm install --frozen-lockfile
      - run: pnpm exec tsc --noEmit
      - run: pnpm lint
      - run: pnpm build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_SOCKET_URL: ${{ vars.VITE_SOCKET_URL }}
          VITE_KAKAO_URL: ${{ vars.VITE_KAKAO_URL }}

      # Pages 는 정적 파일만 서비스하므로 /rooms 같은 경로로 직접 들어오면 404 가 됨
      # 404 를 index.html 로 채워 두면 라우터가 경로를 받아 처리함
      - run: cp dist/index.html dist/404.html

      - uses: actions/upload-pages-artifact@v3
        if: inputs.deploy
        with:
          path: web/dist

  # 서버가 아직 배포되지 않아 API 주소가 비어 있음
  # 그대로 올리면 화면은 뜨지만 로그인도 방 목록도 전부 실패하므로
  # 배포는 명시적으로 요청했을 때만 함
  # 서버 주소가 생기면 저장소 변수를 채우고 deploy 를 체크해 실행하면 됨
  deploy:
    needs: build
    if: inputs.deploy
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    steps:
      - id: deploy
        uses: actions/deploy-pages@v4
